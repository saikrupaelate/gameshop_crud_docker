name: CI/CD Pipeline - Game Shop

on:
  workflow_dispatch:  # Manual trigger via Actions button
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push server image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/server:latest ./server
        docker push ${{ secrets.DOCKER_USERNAME }}/server:latest

    - name: Build & Push frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/client:latest ./client
        docker push ${{ secrets.DOCKER_USERNAME }}/client:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          echo ">>> Freeing disk space..."
          sudo apt-get clean
          sudo journalctl --vacuum-size=50M
          docker system prune -a -f --volumes
          
          echo ">>> Stopping and cleaning old containers..."
          docker-compose -f ~/gameshop_crud_docker/docker-compose.yml down -v || true
          docker container stop $(docker ps -aq) || true
          docker container rm $(docker ps -aq) || true
          docker rmi -f $(docker images -aq) || true
          docker volume prune -f || true
          docker network prune -f || true
          docker system prune -f || true
          
          echo ">>> Remove old app folder..."
          rm -rf ~/gameshop_crud_docker || true

          echo "Cloning latest code..."
          git clone https://github.com/saikrupaelate/gameshop_crud_docker.git ~/gameshop_crud_docker

          echo "Pulling updated images..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/server:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/client:latest

          echo ">>> Building containers (no cache)..."
          cd ~/gameshop_crud_docker
          docker compose build --no-cache

          echo "Starting containers..."
          cd ~/gameshop_crud_docker
          docker compose up -d

          echo "✅ Deployment complete."